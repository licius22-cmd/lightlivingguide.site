<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="max-image-preview:large">
<title>Front</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#240001;
    font-family:"Roboto",Arial,sans-serif;
    color:#e8e8e8;
    text-align:center;
  }
  .page{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px;
  }
  .alert-box{
    border:2px solid #cc2222;
    border-radius:6px;
    padding:10px 20px;
    display:inline-block;
    background:rgba(180,0,0,0.08);
    margin:80px auto 20px;
  }
  .alert-box .label{color:#ff3333;font-weight:bold;font-size:18px}
  .alert-box .text{color:#e8e8e8;font-size:18px}
  .video{width:100%;max-width:400px;margin:0 auto}
  .video .frame{position:relative;padding:133.333% 0 0}
  .video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
  .cta{display:none;margin:30px auto 0}
  .cta.show{display:inline-block;animation:fadeIn 1s ease}
  .cta a{
    display:inline-block;
    background:#FF3030;
    color:#fff;
    font-size:20px;
    font-weight:500;
    line-height:1;
    border-radius:11px;
    padding:19px 80px;
    text-decoration:none;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @media(max-width:767px){
    .alert-box{margin-top:0}
    .cta a{font-size:18px;padding:19px 40px}
  }
</style>
</head>
<body>
  <div class="page">

    <!-- Aviso de escassez -->
    <div class="alert-box">
      <span class="label">Atención: </span>
      <span class="text" id="alert-text">Este video saldrá del aire hoy a las 23:59.</span>
    </div>

    <!-- Video (vturb / converteai) -->
    <div class="video">
      <div class="frame">
        <iframe id="vsl" src="embed.html" allowfullscreen referrerpolicy="origin"
          onload="this.onload=null;this.src='https://scripts.converteai.net/99713561-339f-427a-90c1-f62825306f1f/players/69b8491aec3c62fc7c24e926/v4/embed.html'+(location.search||'?')+'&vl='+encodeURIComponent(location.href)"></iframe>
      </div>
    </div>

    <!-- CTA (aparece após o pitch do video) -->
    <div class="cta" id="cta">
      <a id="buy" href="https://pay.hotmart.com/V105304143N?checkoutMode=10">Sí, quiero volver a coger!</a>
    </div>

  </div>

<script>
  // Data limite dinâmica no aviso (hoje, ou amanhã se já passou das 23:59)
  (function(){
    var n=new Date(), d=new Date(n.getFullYear(),n.getMonth(),n.getDate(),23,59,0);
    if(n>=d)d.setDate(d.getDate()+1);
    var p=function(x){return String(x).padStart(2,'0')};
    document.getElementById('alert-text').textContent=
      'Este video saldrá del aire el día '+p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' a las 23:59.';
  })();

  // Botão de compra aparece após 822s (momento do pitch no video)
  setTimeout(function(){document.getElementById('cta').classList.add('show')},822000);

  // Repassa parâmetros UTM da URL para o link de checkout
  (function(){
    var q=window.location.search;
    if(q.length>1){
      var a=document.getElementById('buy');
      a.href+=(a.href.indexOf('?')===-1?'?':'&')+q.slice(1);
    }
  })();
</script>
</body>
</html>
